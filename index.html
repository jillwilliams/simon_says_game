<body>
    <div class="container">
        <div class="gameboard">
            <div class="title-div">

                <h1>SIMON SAYS</h1>
                <img src="./images/simon_says.png" alt="simon says" class="simon-image" />
            </div>
            <div class="directions">

                    <div class="second-row">

                    </div>
